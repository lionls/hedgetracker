[project]
name = "hedgetracker"
version = "0.1.0"
description = "Prefect pipelines for tracking hedge fund fund flow from SEC 13F-HR filings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prefect>=3.1,<4",
    "edgartools>=5.1.0",
    "pandas>=2.0.0",
    "pyarrow>=17.0.0",
    "duckdb>=1.5.5",
]

[project.scripts]
hedgetracker = "hedgetracker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedgetracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the SEC EDGAR API over the network (deselect with '-m \"not live\"')",
]
addopts = "-ra -m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
