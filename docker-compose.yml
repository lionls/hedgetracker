# Local Prefect server + worker for exercising the 13F flows end to end.
#
#   docker compose up -d --build     # server + worker, built from this repo
#   open http://localhost:4200       # Prefect UI
#
# The market explorer is a separate service in the same file, under its own
# profile so a bare `up` stays the harness:
#
#   docker compose up -d --build explorer   # market explorer on :8080
#
# See the "Docker Compose" section of README.md for triggering runs.
#
# Everything runs one image built from this repo, so the server, the worker and
# the CLI share the exact Prefect and edgartools versions from uv.lock. The server
# uses SQLite on a volume: right for a throwaway harness, and swapping in Postgres
# only means adding a service and setting
# PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://...
name: hedgetracker

# One image, built from this repo, shared by every service below.
# `hedgetracker:dev` is a local tag with no registry behind it, so
# `pull_policy: build` tells Compose to build instead of first looking for
# docker.io/library/hedgetracker:dev and warning that it does not exist.
x-image: &image
  build: .
  image: hedgetracker:dev
  pull_policy: build

# Shared by the worker and the one-shot CLI: same network and lake, so a run
# started either way lands in the same Parquet partitions.
x-app: &app
  <<: *image
  environment:
    # Override both to point the worker and the one-shot CLI at another Prefect
    # instance: `PREFECT_API_URL=... PREFECT_API_KEY=... docker compose up -d
    # --no-deps worker`. An unset key stays empty, which an unauthenticated
    # server accepts.
    PREFECT_API_URL: ${PREFECT_API_URL:-http://prefect-server:4200/api}
    PREFECT_API_KEY: ${PREFECT_API_KEY:-}
    SEC_IDENTITY_EMAIL: ${SEC_IDENTITY_EMAIL:-mark@gmail.com}
    HEDGETRACKER_BASE_DIR: /data/lake
    EDGAR_HTTP_TIMEOUT: ${EDGAR_HTTP_TIMEOUT:-60}
  volumes:
    - lake:/data
    - edgar-cache:/root/.edgar
  depends_on:
    prefect-server:
      condition: service_healthy

services:
  prefect-server:
    <<: *image
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      # The UI runs in the browser, so it reaches the API on the published port.
      PREFECT_UI_API_URL: http://localhost:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    volumes:
      # Default location of prefect.db; keeps runs across restarts.
      - prefect-data:/root/.prefect
    ports:
      - "4200:4200"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request as u;
          u.urlopen('http://127.0.0.1:4200/api/health').read()"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    <<: *app
    # A deployment can only target an existing work pool, and both steps are
    # idempotent, so they are safe to repeat on every restart. A non-login shell
    # keeps the image's PATH (a login shell would replace it).
    command:
      - bash
      - -c
      - >-
        prefect work-pool create process-pool --type process || true;
        prefect deploy --all;
        exec prefect worker start -p process-pool --type process

  # One-shot CLI, not started by `up`: `docker compose --profile cli run --rm cli`.
  cli:
    <<: *app
    profiles: ["cli"]
    entrypoint: ["hedgetracker"]
    command: ["run", "--year", "2024", "--quarter", "3", "--limit", "5"]

  # Market explorer: the Go + DuckDB API and the built React frontend in one
  # image, reading the dataset straight off Hugging Face. It shares nothing with
  # the harness above — no lake, no Prefect — so it sits behind its own profile
  # and a bare `up` leaves it alone:
  #
  #   docker compose up -d --build explorer   # then http://localhost:8080
  #
  # EXPLORER_PORT moves the published port; the container itself always listens
  # on 8080. The image's own HEALTHCHECK (`marketdata -health`) is inherited.
  explorer:
    profiles: ["explorer"]
    build:
      context: .
      dockerfile: Dockerfile.explorer
    image: hedgetracker-explorer:dev
    pull_policy: build
    # Flags, not environment variables: the binary's defaults are the same, and
    # this is where a server overrides them.
    command:
      - "-addr"
      - ":8080"
      - "-web"
      - "/app/web"
      - "-temp-dir"
      - "/tmp/marketdata"
      - "-memory"
      - "${EXPLORER_MEMORY:-2GB}"
      - "-threads"
      - "${EXPLORER_THREADS:-4}"
    environment:
      # Empty by default: the dataset is read over HTTPS directly. Set
      # EXPLORER_HTTPS_PROXY where the server has no direct egress.
      HTTPS_PROXY: ${EXPLORER_HTTPS_PROXY:-}
      HTTP_PROXY: ${EXPLORER_HTTPS_PROXY:-}
      NO_PROXY: ${EXPLORER_NO_PROXY:-}
    ports:
      - "${EXPLORER_PORT:-8080}:8080"
    volumes:
      # DuckDB's spill directory. None of the dataset is stored: only what a
      # large sort had to push out of memory.
      - marketdata-temp:/tmp/marketdata
    restart: unless-stopped
    # The server drains in-flight queries on SIGTERM, so give it room to finish.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lake:
  edgar-cache:
  prefect-data:
  marketdata-temp:
