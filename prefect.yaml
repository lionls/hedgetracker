# Deployment definitions for `prefect deploy --all`, which the compose worker
# runs on start-up. The schedule is intentionally empty: these run on demand.
name: hedgetracker
prefect-version: 3.8.5

# The worker image already contains this code, and a process work pool runs flows
# in the worker's own filesystem, so no build/push/pull steps are needed.
build: null
push: null
pull: null

deployments:
  - name: 13f-quarterly
    description: >-
      Extract one EDGAR quarterly index window of 13F-HR filings into the Parquet
      data lake, partitioned by each filing's report period.
    entrypoint: src/hedgetracker/flows/sec_13f.py:extract_quarterly_13f
    tags:
      - sec
      - 13f
    work_pool:
      name: process-pool
    # A small default window keeps an accidental trigger polite to the SEC; pass
    # --param limit=... (or null for a whole quarter) when running.
    # user_email is the test identity from settings.py: override it with
    # --param user_email=... before a real run, the SEC wants a reachable address.
    parameters:
      user_email: mark@gmail.com
      year: 2024
      quarter: 3
      limit: 5

  - name: 13f-backfill
    description: >-
      Sweep every closed EDGAR quarterly index window in a range of years, one
      subflow run per quarter, oldest first. Defaults to the XML era (2013
      onward); pass start_year=1993 to also read the tables embedded in older
      submissions.
    entrypoint: src/hedgetracker/flows/sec_13f.py:backfill_13f
    tags:
      - sec
      - 13f
      - backfill
    work_pool:
      name: process-pool
    # end_year null means "the current year"; windows that have not closed yet are
    # skipped. A full-history sweep is hours of SEC traffic — trigger it when the
    # SEC is quiet, and re-run single quarters with 13f-quarterly if one fails.
    # user_email is the test identity from settings.py: override with
    # --param user_email=... before a real run.
    parameters:
      user_email: mark@gmail.com
      start_year: 2013
      end_year: null

  - name: 13f-compact
    description: >-
      Merge each extracted quarter of the lake into one Parquet file per
      partition. The extraction writes a file per filer so that every filing lands
      atomically; this leaves the same rows in the same layout, four files per
      year instead of thousands. Convergent: a quarter already merged is left
      untouched, and a filing extracted since the last run is merged in by the
      next one.
    entrypoint: src/hedgetracker/flows/sec_13f.py:compact_13f
    tags:
      - sec
      - 13f
      - compaction
    work_pool:
      name: process-pool
    # year null means "every year the lake holds"; pass --param year=2024 to merge
    # one report year only. Run it while the extraction is idle: a part written
    # during a merge is not in the merged file, so it stays a part until the next
    # run, and --param quarters=... narrows which quarters are visited.
    parameters:
      year: null
      quarters: [1, 2, 3, 4]
